# Despliegue en VM propia (alternativa a Vercel).
#
# Tres contenedores, como quedó en el levantamiento:
#   nginx  — único punto de entrada público, termina TLS
#   app    — Next.js
#   db     — PostgreSQL con volumen persistente
#
# Nota de seguridad: `app` y `db` NO exponen puertos al host. Solo nginx
# publica 80/443. Si publicaras el 5432 "para conectarte cómodo desde tu
# máquina", estarías abriendo la base a internet.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sitti
      POSTGRES_USER: sitti
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitti"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DEMO_MODE: ${DEMO_MODE:-false}
      AUTH_SECRET: ${AUTH_SECRET:?define AUTH_SECRET en .env}
      DATABASE_URL: postgresql://sitti:${POSTGRES_PASSWORD}@db:5432/sitti
      NEXT_PUBLIC_MAPTILER_KEY: ${NEXT_PUBLIC_MAPTILER_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app

volumes:
  pgdata:
